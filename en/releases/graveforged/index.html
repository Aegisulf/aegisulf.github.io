  <script>
    (function () {
      var here = document.documentElement.lang.indexOf('zh') === 0 ? 'zh' : 'en';
      function pref() {
        try { var s = localStorage.getItem('lang'); if (s === 'en' || s === 'zh') return s; } catch (e) { /* storage unavailable */ }
        var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        return l.some(function (x) { return /^zh/i.test(x); }) ? 'zh' : 'en';
      }
      function save(l) { try { localStorage.setItem('lang', l); } catch (e) { /* ignore */ } }
      document.querySelectorAll('[data-set-lang]').forEach(function (a) {
        a.addEventListener('click', function () { save(a.dataset.setLang); });
      });
      // Preview player: the third-party iframe is only created after a click
      document.querySelectorAll('.player-load').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var f = document.createElement('iframe');
          f.src = btn.dataset.src;
          f.title = btn.dataset.title;
          f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
          f.allowFullscreen = true;
          f.className = 'player-frame player-' + btn.dataset.kind;
          btn.parentNode.replaceChildren(f);
        });
      });

      var banner = document.getElementById('lang-banner');
      if (banner && pref() !== here) banner.hidden = false;
      var stay = document.getElementById('lang-stay');
      if (stay) stay.addEventListener('click', function () { save(here); banner.hidden = true; });
    })();
  </script>
