  <script>
    (function () {
      // remember the visitor's explicit language choice (the home page reads it)
      function save(l) { try { localStorage.setItem('lang', l); } catch (e) { /* ignore */ } }
      document.querySelectorAll('[data-set-lang]').forEach(function (a) {
        a.addEventListener('click', function () { save(a.dataset.setLang); });
      });
      // Share: native share sheet when available, otherwise copy the link
      var toast = document.getElementById('toast'), toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
      }
      document.querySelectorAll('.share-page').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var data = { title: document.title, text: btn.dataset.text, url: btn.dataset.url };
          if (navigator.share) {
            try { await navigator.share(data); } catch (e) { /* cancelled by the visitor */ }
            return;
          }
          try {
            await navigator.clipboard.writeText(data.url);
            showToast(btn.dataset.copied);
          } catch (e) {
            var ta = document.createElement('textarea');
            ta.value = data.url;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand('copy');
            ta.remove();
            showToast(ok ? btn.dataset.copied : btn.dataset.failed);
          }
        });
      });

      // Preview player: the third-party iframe is only created after a click
      document.querySelectorAll('.player-load').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var f = document.createElement('iframe');
          f.src = btn.dataset.src;
          f.title = btn.dataset.title;
          f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
          f.allowFullscreen = true;
          f.className = 'player-frame player-' + btn.dataset.kind;
          btn.parentNode.replaceChildren(f);
        });
      });

    })();
  </script>
