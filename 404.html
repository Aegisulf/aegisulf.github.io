<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGISULF</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0d11">
  <link rel="canonical" href="https://aegisulf.com/">
  <!-- GitHub Pages serves this file for every unknown address. Its addresses are case-sensitive, so first try the same address in lower case
       (/LycanZip/faq/ -> /lycanzip/faq/); an address that is still unknown comes back here already in lower case and goes to the home page. -->
  <script>
    (function () {
      var p = location.pathname, l = p.toLowerCase();
      location.replace(l !== p ? l + location.search + location.hash : '/');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #050408; color: #a09eae; font-family: system-ui, sans-serif; }
    a { color: #e63946; }
  </style>
</head>
<body>
  <p><a href="/">aegisulf.com</a></p>
</body>
</html>
