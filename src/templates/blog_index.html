{% extends "base.html" %}
{% block content %}
<main class="index">
  <h1>{{ t.blog }}</h1>
  <ul class="post-list">
    {%- for p in posts %}
    <li>
      <a href="{{ p.path }}">
        <time datetime="{{ p.date.isoformat() }}">{{ p.date.isoformat() }}</time>
        <strong>{{ p.title }}</strong>
        {%- if p.summary %}<span>{{ p.summary }}</span>{% endif %}
      </a>
    </li>
    {%- endfor %}
  </ul>
</main>
{% endblock %}
