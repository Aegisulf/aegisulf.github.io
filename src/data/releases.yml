# One entry per release shown on the site (r001 / r002 are intentionally hidden).
#
# links.<platform> accepts:
#   "https://..."        exact URL of this release on that platform
#   true                 live, but exact URL not filled in yet -> falls back to the artist page
#                        (the build prints a warning so it is not forgotten)
#   {soon: 2026-10-16}   not live yet, shows "Platform · Oct 16" (date optional: {soon: true})
#   (omitted)            not available there, button hidden
#
# hidden: true     -> kept here but not built/published (no pages, no cover)
# upcoming: true   -> teaser page, listed under "Upcoming"
# featured: true   -> shown on the hub (only one); otherwise the newest released one is used

- slug: graveforged
  order: 6
  title: Graveforged
  accent: "#3fa9ff"
  upcoming: true
  links:
    bandcamp: {soon: true}

- slug: clan-guardian
  order: 5
  title: Clan Guardian
  accent: "#ff9a2e"
