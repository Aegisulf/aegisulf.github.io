name: Build site

# Rebuilds the generated pages (index.html, en/, zh/, sitemap.xml) whenever the sources change,
# so content can be edited from GitHub / a phone without running the build locally.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python tools/build.py

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "Rebuild site"
            git pull --rebase origin main
            git push
          fi
